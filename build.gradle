plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.cosmocats'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

ext {
	minimumCoveragePerFile = 0.6
	filesExcludedFromCoverage = [
			'**/*MarketplaceApplication.*'
	]
}

jacoco {
	reportsDirectory = layout.buildDirectory.dir('reports/coverage')
}

test {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

def coverageClassDirs = files(sourceSets.main.output.classesDirs.files.collect {
	fileTree(dir: it, exclude: filesExcludedFromCoverage)
})

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(coverageClassDirs)

	reports {
		html.required = true
		xml.required = true
		html.outputLocation = layout.buildDirectory.dir('reports/coverage')
	}

	finalizedBy tasks.named('jacocoTestCoverageVerification')
}

tasks.named('jacocoTestCoverageVerification') {
	description = 'Fails the build when a source file has less line coverage than minimumCoveragePerFile'
	classDirectories.setFrom(coverageClassDirs)

	violationRules {
		rule {
			enabled = true
			failOnViolation = true
			element = 'SOURCEFILE'
			limit {
				counter = 'LINE'
				minimum = minimumCoveragePerFile
			}
		}
	}
}