# v1.4 — демо-дані (лише для context=demo): категорії, товари, один покупець.
databaseChangeLog:

  - changeSet:
      id: 1.4-001-demo-categories
      author: Shizulka
      context: demo
      changes:
        - sql:
            sql: INSERT INTO categories (name, description) VALUES ('Toys', 'Toys for cosmic cats')
        - sql:
            sql: INSERT INTO categories (name, description) VALUES ('Food', 'Food from across the galaxy')
      rollback:
        - sql:
            sql: DELETE FROM categories WHERE name IN ('Toys', 'Food')

  - changeSet:
      id: 1.4-002-demo-products
      author: Shizulka
      context: demo
      changes:
        - sql:
            sql: >
              INSERT INTO products (name, description, price, category_id, stock_quantity)
              SELECT 'Galaxy Yarn Ball', 'Antigravity yarn ball for cosmic cats', 19.99, id, 10
              FROM categories WHERE name = 'Toys'
        - sql:
            sql: >
              INSERT INTO products (name, description, price, category_id, stock_quantity)
              SELECT 'Comet Toy', 'Toy shaped like a flying comet', 12.50, id, 15
              FROM categories WHERE name = 'Toys'
        - sql:
            sql: >
              INSERT INTO products (name, description, price, category_id, stock_quantity)
              SELECT 'Cosmic Milk', 'Fresh milk from the Milky Way', 7.50, id, 25
              FROM categories WHERE name = 'Food'
      rollback:
        - sql:
            sql: DELETE FROM products WHERE name IN ('Galaxy Yarn Ball', 'Comet Toy', 'Cosmic Milk')

  - changeSet:
      id: 1.4-003-demo-customer
      author: Shizulka
      context: demo
      changes:
        - sql:
            sql: >
              INSERT INTO customers (id, email, full_name)
              VALUES ('11111111-1111-1111-1111-111111111111', 'demo@cosmo-cats.market', 'Demo Customer')
      rollback:
        - sql:
            sql: DELETE FROM customers WHERE email = 'demo@cosmo-cats.market'
