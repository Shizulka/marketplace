
# Testcontainers керує підключенням до PostgreSQL
# URL, username та password передаються через @DynamicPropertySource

# Liquibase повинен виконувати справжні міграції
spring.liquibase.enabled=true
spring.liquibase.contexts=test

# Hibernate лише перевіряє схему, створену Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

exchange-rate.base-url=http://localhost:8089
