server.port=8081

springdoc.swagger-ui.url=/api-specs/cosmo-cats-api.yml
springdoc.swagger-ui.disable-swagger-default-url=true
exchange-rate.base-url=${EXCHANGE_RATE_URL:http://localhost:8089}
# local (за замовчуванням): вбудований PostgreSQL, див. EmbeddedPostgresConfig; datasource нижче діє для профілю prod
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USERNAME:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.contexts=demo
